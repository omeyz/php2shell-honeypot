# Ship the bait's logs off-box as they are written, so a root attacker who
# wipes local logs does not erase the record.
#
# reopenOnTruncate, plus the copytruncate logrotate override in
# setup-honeypot.sh, are load-bearing. imfile latches a file by INODE: with
# normal rotation (or a file recreated during the build) the monitor keeps
# reading the old inode and live lines stop shipping SILENTLY -- no error,
# nothing in the logs, the primary intel source just goes quiet.
#
# audit.log is deliberately NOT monitored here. Kernel audit records already
# reach the gateway through the kernel log, so reading the file as well
# doubles the volume for nothing.
module(load="imfile")
input(type="imfile" File="/var/log/apache2/access.log" Tag="apache-access" Severity="info" reopenOnTruncate="on")
input(type="imfile" File="/var/log/apache2/error.log"  Tag="apache-error"  Severity="info" reopenOnTruncate="on")
input(type="imfile" File="/var/log/php_errors.log"     Tag="php-error"     Severity="info" reopenOnTruncate="on")
*.* action(type="omfwd" Target="GATEWAY_PRIV_IP" Port="514" Protocol="udp")
